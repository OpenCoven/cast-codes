[profile.default]
# Mark a test as slow if it takes longer than 30s to execute, and terminate it
# if it takes 2x as long as the slow timeout (i.e.: 60s total).
slow-timeout = { period = "30s", terminate-after = 2 }

[test-groups]
settings-file-reload = { max-threads = 1 }
# Quarantine group for a UI-positioning shell integration test that flakes on
# loaded macOS runners. See #211.
copy-prompt-quarantine = { max-threads = 1 }

[[profile.default.overrides]]
filter = 'package(integration)'
# Integration tests are heavier-weight than unit tests, so have each one
# count twice against the parallelism limit.  This improves overall runtime
# of the test suite, despite running fewer integration tests at a time.
threads-required = 2

[[profile.default.overrides]]
filter = 'test(test_settings_file_hot_reload_applies_new_values) | test(test_settings_error_banner_on_reload_with_invalid_value) | test(test_settings_error_banner_on_reload_with_invalid_toml)'
# Settings file reload integration tests are app-heavy and can exceed the
# default 60s termination threshold under full-suite load.
test-group = 'settings-file-reload'
slow-timeout = { period = "45s", terminate-after = 3 }

[profile.ci]
# Print out output for failing tests as soon as they fail, and also at the end
# of the run (for easy scrollability).
failure-output = "immediate-final"
# Do not cancel the test run on the first failure.
fail-fast = false

[[profile.ci.overrides]]
filter = 'package(integration)'
# On CI, try integration tests up to 3 times (in total) to reduce the impact of
# flaky tests.
retries = 2

[profile.ci.junit]
# Output nextest results in junit format (for uploading to buildpulse).
# If `--profile ci` is selected on the command line, then the JUnit report will
# be written out to `target/nextest/ci/junit.xml`. 
# Docs: https://nexte.st/docs/machine-readable/junit/
path = "junit.xml"

[[profile.ci.overrides]]
# On Windows CI, update_manager tests are flaky and often time out but succeed after a retry
# Evidence suggest that the test itself passes but the process running it hangs
# We haven't figured out why the process hangs, so this is a workaround to unblock devs
filter = 'test(update_manager)'
platform = { host = 'cfg(target_os = "windows")' }
retries = 2

[[profile.ci.overrides]]
# On macOS CI, `test_copy_prompt_from_input_honor_ps1_enabled` intermittently
# panics with "No position for Copy prompt" — a layout-timing flake when the
# runner is loaded (it already exhausts the default integration retries=2).
# Isolate it to a single thread (less contention starving layout) and give it
# extra retries while the root cause is investigated. See #211.
filter = 'test(test_copy_prompt_from_input_honor_ps1_enabled)'
platform = { host = 'cfg(target_os = "macos")' }
test-group = 'copy-prompt-quarantine'
retries = 4
